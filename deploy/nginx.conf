server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # frame-ancestors solo funciona como cabecera HTTP (en <meta> el navegador lo ignora)
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # La API (la documentacion /docs, /redoc y /openapi.json NO se reenvia: queda interna)
    location /api/ {
        proxy_pass http://ftir-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Angular: cualquier ruta del frontend vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
