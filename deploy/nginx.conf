# Limites por IP real (la IP llega en X-Forwarded-For desde el proxy compartido, red privada de Docker)
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=por_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    # frame-ancestors solo funciona como cabecera HTTP (en <meta> el navegador lo ignora)
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cabeceras de peticion lentas/enormes (Slowloris, desbordes)
    client_header_timeout 10s;
    client_body_timeout 30s;
    large_client_header_buffers 4 8k;
    limit_conn por_ip 30;

    # Autenticacion: pocos intentos por minuto y por IP (frena fuerza bruta, relleno de credenciales y spam de correos)
    location ~ ^/api/auth/(login|register|forgot-password|reset-password|verify-email)$ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://ftir-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    # La API (la documentacion /docs, /redoc y /openapi.json NO se reenvia: queda interna)
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://ftir-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    # Angular: cualquier ruta del frontend vuelve a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
